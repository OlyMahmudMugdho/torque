<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torque</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #141517;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .splash-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #1e1f22;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .splash-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }
    .splash-footer {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 14px 20px 12px 20px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.4) 60%, transparent);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .splash-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #c2c5cc;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3574f0;
      box-shadow: 0 0 8px #3574f0;
      animation: pulse 1.2s infinite ease-in-out;
    }
    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #3574f0, #5b8def, #3574f0);
      animation: indeterminate 1.4s infinite ease-in-out;
    }
    @keyframes indeterminate {
      0% { left: -45%; width: 45%; }
      50% { left: 25%; width: 55%; }
      100% { left: 100%; width: 45%; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img src="splash.png" alt="Torque Splash" class="splash-img" />
    <div class="splash-footer">
      <div class="splash-meta">
        <span class="status-badge">
          <span class="status-dot"></span>
          <span>Loading Torque...</span>
        </span>
        <span style="opacity: 0.7;">Torque 0.4.1</span>
      </div>
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>
</body>
</html>
